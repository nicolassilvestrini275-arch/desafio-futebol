<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>História do Futebol</title>

<style>

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    text-align: center;
    background: #5e17a8;
    color: white;
}

h1 {
    font-size: 30px;
}

#vidas {
    font-size: 26px;
    margin: 15px;
}

.caixa {
    max-width: 600px;
    margin: 20px auto;
    padding: 25px;
    background: white;
    color: black;
    border-radius: 20px;
}

#pergunta {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 20px;
}

button {
    width: 100%;
    padding: 16px;
    margin: 8px 0;
    border: none;
    border-radius: 12px;
    background: #5e17a8;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

#resultado {
    margin-top: 20px;
}

.trofeu {
    font-size: 65px;
}

.pontuacao {
    font-size: 27px;
    font-weight: bold;
}

.nivel {
    font-size: 21px;
    font-weight: bold;
    margin: 10px;
}

.recorde {
    font-size: 19px;
    font-weight: bold;
    margin: 15px;
}

.fim {
    font-size: 24px;
    font-weight: bold;
    margin: 15px;
}

</style>

</head>

<body>

<h1>📜 História do Futebol</h1>

<p id="progresso">Pergunta 1 de 10</p>

<div id="vidas">❤️❤️❤️</div>

<div class="caixa">

<div id="pergunta"></div>

<div id="opcoes"></div>

<div id="resultado"></div>

</div>

<script>

var perguntas = [

[
"Em qual país o futebol moderno foi organizado no século XIX?",
["Brasil","Inglaterra","França","Itália"],
1
],

[
"Em que ano a FIFA foi fundada?",
["1904","1910","1930","1950"],
0
],

[
"Qual foi o primeiro país a sediar uma Copa do Mundo?",
["Brasil","França","Uruguai","Itália"],
2
],

[
"Em que ano aconteceu a primeira Copa do Mundo?",
["1920","1930","1940","1950"],
1
],

[
"Qual seleção foi campeã da primeira Copa do Mundo?",
["Brasil","Argentina","Uruguai","Itália"],
2
],

[
"Em qual ano o Brasil conquistou sua primeira Copa do Mundo?",
["1950","1954","1958","1962"],
2
],

[
"Quem é conhecido como Rei do Futebol?",
["Pelé","Maradona","Zico","Ronaldo"],
0
],

[
"Qual jogador argentino é uma grande lenda do futebol?",
["Cafu","Maradona","Rivaldo","Romário"],
1
],

[
"Qual competição reúne seleções nacionais de futebol?",
["Libertadores","Champions League","Copa do Mundo","Copa do Brasil"],
2
],

[
"Qual é o principal objetivo de uma partida de futebol?",
["Fazer gols","Fazer cestas","Marcar pontos com as mãos","Derrubar adversários"],
0
]

];

var atual = 0;

var pontos = 0;

var vidas = 3;


function mostrarPergunta() {

    document.getElementById("progresso").innerHTML =
    "Pergunta " + (atual + 1) + " de 10";

    document.getElementById("vidas").innerHTML =
    "❤️".repeat(vidas) +
    "🖤".repeat(3 - vidas);

    document.getElementById("pergunta").innerHTML =
    perguntas[atual][0];

    document.getElementById("opcoes").innerHTML = "";

    for (var i = 0; i < 4; i++) {

        var botao = document.createElement("button");

        botao.innerHTML =
        perguntas[atual][1][i];

        botao.setAttribute(
        "data-resposta",
        i
        );

        botao.onclick = function() {

            var resposta =
            Number(
            this.getAttribute("data-resposta")
            );

            responder(resposta);

        };

        document.getElementById("opcoes")
        .appendChild(botao);

    }

}


function responder(resposta) {

    if (
        resposta ===
        perguntas[atual][2]
    ) {

        pontos = pontos + 10;

    } else {

        vidas = vidas - 1;

    }


    if (vidas <= 0) {

        mostrarFimDeJogo();

        return;

    }


    atual = atual + 1;


    if (atual < 10) {

        mostrarPergunta();

    } else {

        mostrarResultado();

    }

}


function mostrarFimDeJogo() {

    document.getElementById("progresso").innerHTML = "";

    document.getElementById("vidas").innerHTML =
    "🖤🖤🖤";

    document.getElementById("pergunta").innerHTML =
    "💥 FIM DE JOGO";

    document.getElementById("opcoes").innerHTML = "";

    document.getElementById("resultado").innerHTML =

    '<div class="fim">' +
    'Você ficou sem vidas!' +
    '</div>' +

    '<div class="pontuacao">' +
    pontos +
    ' pontos' +
    '</div>' +

    '<button onclick="location.reload()">' +
    '🔄 Jogar novamente' +
    '</button>';

}


function mostrarResultado() {

    document.getElementById("progresso").innerHTML = "";

    document.getElementById("vidas").innerHTML =
    "❤️".repeat(vidas);

    document.getElementById("pergunta").innerHTML =
    "🏆 RESULTADO FINAL";

    document.getElementById("opcoes").innerHTML = "";

    var trofeu;

    var nivel;


    if (pontos <= 30) {

        trofeu = "🥉";

        nivel = "Iniciante";

    }

    else if (pontos <= 70) {

        trofeu = "🥈";

        nivel = "Craque";

    }

    else {

        trofeu = "🥇";

        nivel = "Lenda";

    }


    var recorde =
    localStorage.getItem("recordeHistoria");


    if (recorde == null) {

        recorde = 0;

    }

    else {

        recorde = Number(recorde);

    }


    var mensagem = "";


    if (pontos > recorde) {

        recorde = pontos;

        localStorage.setItem(
        "recordeHistoria",
        recorde
        );

        mensagem =
        '<div class="fim">' +
        '🔥 NOVO RECORDE! 🔥' +
        '</div>';

    }


    document.getElementById("resultado").innerHTML =

    '<div class="trofeu">' +
    trofeu +
    '</div>' +

    '<div class="pontuacao">' +
    pontos +
    ' de 100 pontos' +
    '</div>' +

    '<div class="nivel">' +
    'Nível: ' +
    nivel +
    '</div>' +

    mensagem +

    '<div class="recorde">' +
    '🏆 Seu recorde: ' +
    recorde +
    ' pontos' +
    '</div>' +

    '<button onclick="location.reload()">' +
    '🔄 Jogar novamente' +
    '</button>';

}


mostrarPergunta();

</script>

</body>

</html>
